# ============================================================
# RGDU-DKPO Training Configuration
# ============================================================
# This file records the configuration used for the RGDU-DKPO
# experiments reported in the paper.
#
# Note:
# The current training entry point uses command-line arguments.
# This YAML file is provided as a reproducibility/configuration
# reference for the public release.
# ============================================================

experiment:
  name: rgdu_dkpo
  seed: 42
  data_seed: 42

model:
  base_model: /path/to/Meta-Llama-3-8B-Instruct
  model_type: LlamaForInputContrastivew_act_inhibit

training_data:
  train_file: /path/to/pip_kag_train_dkpo_v31.jsonl
  format_example: examples/train_example.jsonl

training:
  train_mode: dkpo_contrastive

  max_length: 1024
  max_steps: 2100

  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  world_size: 2
  effective_batch_size: 32

  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 1.0e-5

  bf16: true
  gradient_checkpointing: false

  save_steps: 300
  logging_steps: 10

lora:
  enabled: true
  r: 64
  alpha: 64
  dropout: 0.0
  bias: none

  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

parametric_suppression:
  inhibit_strength: 0.0

  inhibit_layers:
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 26

loss:
  alpha: 0.5
  beta: 0.5

  initial_margin: 1.0
  final_margin: 5.0

  cd:
    eta: 0.0
    margin: 1.0
    final_margin: 1.0

  dkpo:
    eta: 0.0
    detach_cc: true

  preference_regularization:
    eta: 0.0
    margin: 1.0

  rgdu:
    eta: 0.1
    gate_margin: 1.0

    # Corresponding experimental schedule:
    gamma_g:
      initial: 1.0
      final: 5.0
      schedule: linear

    gamma_c:
      value: 1.0
      schedule: fixed

output:
  output_dir: outputs/rgdu_dkpo
  overwrite_output_dir: false

distributed:
  ddp_find_unused_parameters: false
